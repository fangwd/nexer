openapi: 3.0.3
info:
  title: Nexer Admin API
  version: "1.0.0"
  description: |
    OpenAPI description of the administrative endpoints implemented in `runtime/src/admin_server.cc`.
    Every response includes an `X-Request-Id` header generated by the server. Unless otherwise noted,
    operations require the admin token header defined by `config.admin.auth_header` (defaults to
    `X-Nexer-Admin-Token`); a nonempty token is mandatory whenever the listener is enabled and only
    `/admin/healthz` is public (unless `health_require_auth`). The listener is plaintext HTTP;
    `require_tls: true` makes startup fail because native TLS is unsupported. Process state comes
    from the process manager: `state` is the
    observed state and `desired_state` the operator intent. Restart works for exited processes
    too. The signal and DELETE routes send raw signals and do not change the desired state, so a
    `restart` policy may relaunch the process. Shutdown is shared with SIGINT/SIGTERM: `delay_ms`
    postpones it, `grace_ms` drains open proxy connections before SIGTERM, and `force_after_ms`
    bounds the wait after SIGTERM before SIGKILL. Once shutdown is requested every POST/DELETE
    route except `/admin/shutdown` answers 503 while GET routes keep working. Logs and audit
    entries are in memory; process details list environment keys with redacted values and audit
    entries never contain credentials. See README.md for configuration and current runtime
    limitations.
servers:
  - url: http://127.0.0.1:8301
    description: Local plaintext admin listener when enabled (disabled by default).
security:
  - AdminToken: []
tags:
  - name: Health
    description: Service liveness and readiness probes.
  - name: Processes
    description: Inspect or control managed processes.
  - name: Logs
    description: Tail or stream process output.
  - name: Control
    description: Nexer runtime control actions such as shutdown.
  - name: Audit
    description: Access to the admin audit trail.
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Nexer-Admin-Token
      description: >-
        Value must match the configured admin token. Exact header name is configurable through
        `config.admin.auth_header` (default shown).
  headers:
    RequestId:
      description: Unique identifier attached to the handled request for traceability.
      schema:
        type: string
  parameters:
    ProcessName:
      name: process
      in: path
      required: true
      schema:
        type: string
      description: Name of a configured app/process as shown by the list endpoint.
    DryRunQuery:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
      description: When `true`, report which apps would be stopped without stopping anything.
    LogLinesParam:
      name: lines
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: >-
        Number of lines to return. `0` or absent uses the configured default (clamped to the
        configured maximum).
    LogPipeParam:
      name: pipe
      in: query
      required: false
      schema:
        type: string
        enum: [stdout, stderr, both]
      description: Select which stream(s) to read. Defaults to both.
    LogTokenParam:
      name: token
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: >-
        When present, only log entries with ids larger than the token are returned (use
        `next_token` from a prior response).
    StreamTokenParam:
      name: token
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Resume streaming from the given log id (same as the SSE `Last-Event-Id`).
    LastEventIdHeader:
      name: Last-Event-Id
      in: header
      required: false
      schema:
        type: string
      description: Resume a Server-Sent Event stream from the provided event id.
  responses:
    UnauthorizedError:
      description: Missing admin token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Invalid or rejected admin token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShuttingDownError:
      description: Shutdown was requested; mutating routes are rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
          description: "`server_error` or `request_error`."
        message:
          type: string
        request_id:
          type: string
      required: [timestamp, status, error, message]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]
    ReadinessBlocker:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
          enum: [starting, ready, backoff, stopping, stopped, completed, failed]
        desired_state:
          type: string
          enum: [running, stopped]
      required: [name, state, desired_state]
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        startup_complete:
          type: boolean
          description: True once every auto_start app and dependency became ready.
        shutting_down:
          type: boolean
        blocking:
          type: array
          description: Required apps that are not ready (including explicitly stopped ones).
          items:
            $ref: '#/components/schemas/ReadinessBlocker'
      required: [status, startup_complete, shutting_down, blocking]
    AdminLogsInfo:
      type: object
      properties:
        default_tail_lines:
          type: integer
          format: int64
        max_tail_lines:
          type: integer
          format: int64
      required: [default_tail_lines, max_tail_lines]
    AdminInfo:
      type: object
      properties:
        bind:
          type: string
        port:
          type: integer
        tls:
          type: boolean
        logs:
          $ref: '#/components/schemas/AdminLogsInfo'
      required: [bind, port, tls, logs]
    InfoResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        uptime_ms:
          type: integer
          format: int64
        version:
          type: string
        commit:
          type: string
        admin:
          $ref: '#/components/schemas/AdminInfo'
      required: [timestamp, started_at, uptime_ms, version, commit, admin]
    ProcessLastExit:
      type: object
      properties:
        code:
          type: integer
        signal:
          type: string
        at:
          type: string
          format: date-time
      required: [code, signal, at]
    ProcessIoStats:
      type: object
      properties:
        stdout_bytes:
          type: integer
          format: int64
        stderr_bytes:
          type: integer
          format: int64
        stdout_lines:
          type: integer
          format: int64
        stderr_lines:
          type: integer
          format: int64
        last_stdout_at:
          type: string
          format: date-time
          nullable: true
        last_stderr_at:
          type: string
          format: date-time
          nullable: true
      required: [stdout_bytes, stderr_bytes, stdout_lines, stderr_lines, last_stdout_at, last_stderr_at]
    ProcessSummary:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [service, task, external]
        pid:
          type: integer
        state:
          type: string
          description: >-
            Observed state. `starting` until the readiness checker passes (or immediately after
            spawn without a checker), `ready` once available, `backoff` while waiting for an
            automatic restart, `stopping` after SIGTERM, `stopped` after a deliberate stop,
            `completed` after a zero exit and `failed` after a nonzero exit, spawn failure,
            readiness timeout, dependency failure or an exhausted restart budget.
          enum: [starting, ready, backoff, stopping, stopped, completed, failed]
        desired_state:
          type: string
          description: Operator intent. `stopped` blocks automatic restarts and proxy requires.
          enum: [running, stopped]
        ready:
          type: boolean
        acquired:
          type: boolean
          description: External resource launched by this run and not stopped since.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Launch time of the current owned process, null when none is running.
        uptime_ms:
          type: integer
          format: int64
        restarts:
          type: integer
          format: int64
          description: Launches of the command beyond the first one.
        retries:
          type: integer
          description: Automatic retries consumed within the current `restart.window_ms`.
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: Scheduled automatic restart while in `backoff`.
        last_error:
          allOf:
            - $ref: '#/components/schemas/ProcessLastError'
          nullable: true
        last_exit:
          allOf:
            - $ref: '#/components/schemas/ProcessLastExit'
          nullable: true
        io:
          $ref: '#/components/schemas/ProcessIoStats'
      required: [name, type, pid, state, desired_state, ready, acquired, started_at, uptime_ms, restarts, retries, next_retry_at, last_error, last_exit, io]
    ProcessLastError:
      type: object
      description: >-
        Last operation error. Negative codes are platform libuv error numbers; `message` names
        the cause (`readiness timeout`, `stopped by operator`, `runtime is shutting down`,
        `cancelled`, or the libuv description). Positive codes are child exit statuses or
        terminating signal numbers.
      properties:
        code:
          type: integer
        message:
          type: string
      required: [code, message]
    ProcessCommand:
      type: object
      properties:
        file:
          type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          description: Configured environment entries as `KEY=<redacted>`; values are never returned.
          items:
            type: string
      required: [file, args, env]
    ProcessOutputFiles:
      type: object
      description: Optional per-app stdout/stderr files configured under `logs`.
      properties:
        stdout_file:
          type: string
          nullable: true
        stderr_file:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          description: Last disk failure (path and reason); null while writing works.
      required: [stdout_file, stderr_file, error]
    ProcessDetail:
      allOf:
        - $ref: '#/components/schemas/ProcessSummary'
        - type: object
          properties:
            command:
              $ref: '#/components/schemas/ProcessCommand'
            logs:
              $ref: '#/components/schemas/ProcessOutputFiles'
          required: []
    ProcessListResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessSummary'
      required: [timestamp, processes]
    LogEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        pipe:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
      required: [id, ts, pipe, text]
    ProcessLogsResponse:
      type: object
      properties:
        process:
          type: string
        pipe:
          type: string
          enum: [stdout, stderr, both]
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        next_token:
          type: integer
          format: int64
      required: [process, pipe, entries]
    LogEvent:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        pipe:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
      required: [ts, pipe, text]
    SignalRequest:
      type: object
      properties:
        signal:
          oneOf:
            - type: string
            - type: integer
              format: int32
      additionalProperties: false
    SignalResponse:
      type: object
      properties:
        process:
          type: string
        signal:
          type: string
      required: [process, signal]
    Operation:
      type: object
      description: Accepted start/stop/restart work; poll `GET /admin/operations/{id}` for the result.
      properties:
        id:
          type: string
        process:
          type: string
        kind:
          type: string
          enum: [start, stop, restart]
        state:
          type: string
          enum: [pending, succeeded, failed]
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        error:
          allOf:
            - $ref: '#/components/schemas/ProcessLastError'
          nullable: true
      required: [id, process, kind, state, created_at, finished_at, error]
    ControlResponse:
      type: object
      properties:
        process:
          type: string
        state:
          type: string
          description: "`starting`, `stopping`, `restarting`, or `planned` for a dry run."
        operation:
          allOf:
            - $ref: '#/components/schemas/Operation'
          nullable: true
          description: Null for a dry run.
      required: [process, state, operation]
    RestartResponse:
      $ref: '#/components/schemas/ControlResponse'
    StopAllResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ControlResponse'
      required: [results]
    ShutdownRequest:
      type: object
      properties:
        delay_ms:
          type: integer
          format: int64
        grace_ms:
          type: integer
          format: int64
        force_after_ms:
          type: integer
          format: int64
        reason:
          type: string
      additionalProperties: false
    ShutdownResponse:
      type: object
      properties:
        status:
          type: string
          enum: [scheduled, shutting_down]
        delay_ms:
          type: integer
          format: int64
        grace_ms:
          type: integer
          format: int64
        force_after_ms:
          type: integer
          format: int64
        shutdown_at:
          type: string
          format: date-time
        reason:
          type: string
      required: [status, delay_ms, grace_ms, force_after_ms, shutdown_at]
    AuditEntry:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        actor:
          type: string
        method:
          type: string
        path:
          type: string
        status:
          type: integer
        request_id:
          type: string
      required: [ts, actor, method, path, status, request_id]
    AuditLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required: [entries]
paths:
  /admin/healthz:
    get:
      tags: [Health]
      summary: Report admin service liveness.
      security: []
      description: >-
        Returns `ok` when the admin server is up. If `config.admin.health_require_auth` is true,
        the call still requires the admin token.
      responses:
        '200':
          description: Service is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          description: Missing token when health checks are protected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/readyz:
    get:
      tags: [Health]
      summary: Report whether initial startup completed and required apps are ready.
      description: >-
        Requires the admin token. Returns 200 only when initial startup completed, no shutdown
        was requested and every `auto_start` app and transitive dependency is `ready` with the
        desired state `running`. Otherwise returns 503 with the blocking apps.
      responses:
        '200':
          description: Runtime is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Startup incomplete, shutdown requested, or a required app is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /admin/info:
    get:
      tags: [Health]
      summary: Return admin service metadata.
      responses:
        '200':
          description: Service metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        '401':
          description: Missing admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/processes:
    get:
      tags: [Processes]
      summary: List managed processes and their status.
      responses:
        '200':
          description: Snapshot of each configured process, including IO counters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessListResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    delete:
      tags: [Processes]
      summary: Stop every running or starting app (alias for per-process stop).
      description: >-
        Each app gets a stop operation. `dry_run=true` returns the plan with `state: planned` and
        no operation. The former `signal` query is rejected with 400; use the signal route.
      parameters:
        - $ref: '#/components/parameters/DryRunQuery'
      responses:
        '202':
          description: Stop operations accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopAllResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '400':
          description: Unsupported `signal` query on the stop alias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '503': { $ref: '#/components/responses/ShuttingDownError' }
  /admin/processes/{process}:
    parameters:
      - $ref: '#/components/parameters/ProcessName'
    get:
      tags: [Processes]
      summary: Inspect a single process.
      responses:
        '200':
          description: Detailed information about the selected process.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '404':
          description: Process name does not map to a known app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Processes]
      summary: Alias for `POST /admin/processes/{process}/stop`.
      description: >-
        `dry_run=true` returns `state: planned` with a null operation and changes nothing. The
        former `signal` query is rejected with 400; use the signal route.
      parameters:
        - $ref: '#/components/parameters/DryRunQuery'
      responses:
        '202':
          description: Stop operation accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '400':
          description: Unsupported `signal` query on the stop alias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': { $ref: '#/components/responses/ShuttingDownError' }
  /admin/processes/{process}/signal:
    post:
      tags: [Processes]
      summary: Deliver an arbitrary signal to a running process.
      parameters:
        - $ref: '#/components/parameters/ProcessName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
            example:
              signal: SIGUSR2
      responses:
        '202':
          description: Signal sent.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '400':
          description: Invalid payload or signal name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown process name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Process is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Signalling failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': { $ref: '#/components/responses/ShuttingDownError' }
  /admin/processes/{process}/start:
    post:
      tags: [Processes]
      summary: Start an app (explicit operator intent).
      description: >-
        Sets the desired state to `running`, lifts a deliberate stop, resets the restart budget and
        ensures the app is ready. Already ready apps succeed immediately; a completed task is rerun.
      parameters:
        - $ref: '#/components/parameters/ProcessName'
      responses:
        '202':
          description: Start accepted; poll the operation for the result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '404':
          description: Unknown process name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': { $ref: '#/components/responses/ShuttingDownError' }
  /admin/processes/{process}/stop:
    post:
      tags: [Processes]
      summary: Stop an app deliberately.
      description: >-
        Sets the desired state to `stopped`, cancels pending starts and retries, terminates the
        owned process group (or runs an acquired external resource's `stop_command`) and blocks
        automatic restarts and proxy requires until an explicit start or restart.
      parameters:
        - $ref: '#/components/parameters/ProcessName'
      responses:
        '202':
          description: Stop accepted; poll the operation for the result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '404':
          description: Unknown process name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': { $ref: '#/components/responses/ShuttingDownError' }
  /admin/operations/{operation}:
    get:
      tags: [Processes]
      summary: Read the result of an accepted start/stop/restart operation.
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operation state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          description: Unknown or expired operation id (the last 256 are retained).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/processes/{process}/restart:
    post:
      tags: [Processes]
      summary: Stop (if running) then start a process through the process manager.
      description: >-
        Sets the desired state to `running`, resets the automatic restart budget and relaunches the
        command even when the previous child already exited. A completed task is rerun. An external
        resource is restarted through its `stop_command` only when this run acquired it. The outcome
        is observable through the process `state`.
      parameters:
        - $ref: '#/components/parameters/ProcessName'
      responses:
        '202':
          description: Restart initiated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartResponse'
        '404':
          description: Unknown process name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: External resource not acquired by this run or without a `stop_command`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': { $ref: '#/components/responses/ShuttingDownError' }
  /admin/processes/{process}/logs:
    get:
      tags: [Logs]
      summary: Fetch buffered stdout/stderr lines for a process.
      description: >-
        The buffer always exists even if the process name is unknown; in that case an empty log set
        is returned. Query parameters control the tail length, stream filter, and pagination token.
      parameters:
        - $ref: '#/components/parameters/ProcessName'
        - $ref: '#/components/parameters/LogLinesParam'
        - $ref: '#/components/parameters/LogPipeParam'
        - $ref: '#/components/parameters/LogTokenParam'
      responses:
        '200':
          description: Log chunk response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessLogsResponse'
        '400':
          description: Invalid pipe filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/processes/{process}/logs/stream:
    get:
      tags: [Logs]
      summary: Stream process logs via Server-Sent Events (SSE).
      description: >-
        Streams existing log lines followed by new ones. Requires `admin.logs.follow_enabled` to be
        `true`, otherwise the server responds with `503`.
      parameters:
        - $ref: '#/components/parameters/ProcessName'
        - $ref: '#/components/parameters/LogPipeParam'
        - $ref: '#/components/parameters/StreamTokenParam'
        - $ref: '#/components/parameters/LastEventIdHeader'
      responses:
        '200':
          description: "Event stream with `event: log` frames whose data payload is JSON encoded."
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                log:
                  summary: Example SSE frame
                  value: |
                    retry: 5000

                    id: 1234
                    event: log
                    data: {"ts":"2024-05-10T21:15:30.123Z","pipe":"stdout","text":"started"}
        '400':
          description: Invalid pipe filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '499':
          description: Client disconnected before the stream started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Log streaming disabled by configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/shutdown:
    get:
      tags: [Control]
      summary: Schedule an instance shutdown using default delays.
      responses:
        '202':
          description: Shutdown scheduled with default timeouts.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownResponse'
        '409':
          description: Shutdown already scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Control]
      summary: Schedule or trigger shutdown with custom delays.
      description: >-
        Same operation as SIGINT/SIGTERM. The 202 response is flushed before listeners close.
        Durations must be nonnegative and at most one day.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShutdownRequest'
      responses:
        '202':
          description: Shutdown scheduled/emitted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Shutdown already scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/audit-log:
    get:
      tags: [Audit]
      summary: List recent admin requests recorded by the audit log.
      responses:
        '200':
          description: Entries are returned in FIFO order respecting the configured retention limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '401':
          description: Missing admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
